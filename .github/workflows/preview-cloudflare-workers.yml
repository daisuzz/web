name: preview-cloudflare-workers

on:
  pull_request:
    branches: [ main ]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci && npm run build
        env:
          HATENA_NAME: ${{ secrets.HATENA_NAME }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          GATSBY_TRACKING_ID: ${{ secrets.GATSBY_TRACKING_ID }}
      - name: Upload preview version to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment preview URL on PR
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-workers-preview -->';
            const url = process.env.DEPLOYMENT_URL || '';
            const body = url
              ? `${marker}\n🔎 Cloudflare Workers preview: ${url}`
              : `${marker}\n⚠️ プレビューデプロイは成功しましたが、プレビューURLを取得できませんでした。Cloudflareダッシュボードでご確認ください。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
